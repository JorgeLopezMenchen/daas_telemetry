<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaaS B2B | Institutional Terminal</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #58a6ff;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        #top-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        #reloj {
            font-size: 1.2em;
            color: #8b949e;
        }
        #latencia {
            font-family: monospace;
            background-color: #1f2428;
            border: 1px solid #444c56;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 1.1em;
            color: #a5d6ff;
        }
        /* --- NUEVO: ESTILO PARA EL BOTÓN DE AUDIO --- */
        #audio-btn {
            background-color: #238636;
            color: white;
            border: 1px solid rgba(240, 246, 252, 0.1);
            padding: 5px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        #audio-btn:hover {
            background-color: #2ea043;
        }
        #audio-btn.muted {
            background-color: #da3633;
        }
        #audio-btn.muted:hover {
            background-color: #f85149;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .ticker-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #f0f6fc;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-family: monospace;
            font-size: 1.1em;
        }
        
        @keyframes flashRed {
            0% { background-color: rgba(220, 38, 38, 0.3); box-shadow: 0 0 15px rgba(220,38,38,0.5); }
            50% { background-color: #161b22; box-shadow: none; }
            100% { background-color: rgba(220, 38, 38, 0.3); box-shadow: 0 0 15px rgba(220,38,38,0.5); }
        }
        @keyframes flashGreen {
            0% { background-color: rgba(22, 163, 74, 0.3); box-shadow: 0 0 15px rgba(22,163,74,0.5); }
            50% { background-color: #161b22; box-shadow: none; }
            100% { background-color: rgba(22, 163, 74, 0.3); box-shadow: 0 0 15px rgba(22,163,74,0.5); }
        }
        .alerta-peligro { animation: flashRed 1s infinite !important; border-color: #ef4444 !important; }
        .alerta-exito { animation: flashGreen 1s infinite !important; border-color: #22c55e !important; }

        .status-badge {
            font-size: 0.7em;
            padding: 4px 8px;
            border-radius: 12px;
            background: #238636;
            color: white;
            font-weight: bold;
        }
        .status-badge.alert-red { background: #da3633; }
        .status-badge.alert-green { background: #22c55e; }
    </style>
</head>
<body>

    <h1>📡 DaaS Engine - Telemetría B2B</h1>
    <div id="top-bar">
        <div id="reloj">Conectando al servidor...</div>
        <div id="latencia">Latencia: -- ms</div>
        <!-- BOTÓN PARA ACTIVAR EL AUDIO -->
        <button id="audio-btn" class="muted">🔇 Activar Sonido</button>
    </div>

    <div class="grid-container" id="dashboard">
        <!-- Las tarjetas de los activos aparecerán aquí -->
    </div>

    <script>
        const API_BASE = "https://with-console-phpbb-temperature.trycloudflare.com/api/v1/market/state";
        
        const memoriaAlertas = {}; 

        // --- CONTROL DE AUDIO AUTORIZADO ---
        let audioContextHabilitado = null;
        let alertasSonorasActivadas = false;

        const audioBtn = document.getElementById('audio-btn');
        audioBtn.addEventListener('click', () => {
            if (!alertasSonorasActivadas) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioContextHabilitado = new AudioContext();
                    const osc = audioContextHabilitado.createOscillator();
                    osc.connect(audioContextHabilitado.destination);
                    osc.start();
                    osc.stop(audioContextHabilitado.currentTime + 0.01);
                }
                alertasSonorasActivadas = true;
                audioBtn.innerText = "🔊 Sonido Activado";
                audioBtn.classList.remove("muted");
            } else {
                alertasSonorasActivadas = false;
                audioBtn.innerText = "🔇 Activar Sonido";
                audioBtn.classList.add("muted");
            }
        });

        function playPing() {
            if (!alertasSonorasActivadas || !audioContextHabilitado) return;
            
            try {
                if (audioContextHabilitado.state === 'suspended') {
                    audioContextHabilitado.resume();
                }
                
                const osc = audioContextHabilitado.createOscillator();
                const gain = audioContextHabilitado.createGain();
                
                osc.connect(gain);
                gain.connect(audioContextHabilitado.destination);
                
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(850, audioContextHabilitado.currentTime); 
                gain.gain.setValueAtTime(0.1, audioContextHabilitado.currentTime);
                
                osc.start();
                osc.stop(audioContextHabilitado.currentTime + 0.15); 
            } catch (e) {
                console.log("Error al reproducir audio:", e);
            }
        }
        
        async function actualizarDatos() {
            try {
                const startFetch = performance.now();
                
                // AQUÍ ESTÁ LA MAGIA: INYECTAMOS LA LLAVE X-API-KEY
                const response = await fetch(`${API_BASE}?nocache=${new Date().getTime()}`, {
                    method: "GET",
                    headers: {
                        "X-API-Key": "Fondo Quant A"
                    }
                });
                
                const endFetch = performance.now();
                const latenciaMs = Math.round(endFetch - startFetch);
                
                const reloj = document.getElementById('reloj');
                const latenciaDiv = document.getElementById('latencia');
                const dashboard = document.getElementById('dashboard');

                // BLOQUEO DE SEGURIDAD 403 CONTROLADO EN PANTALLA
                if (response.status === 403) {
                    reloj.innerText = "⛔ Acceso Denegado: Licencia B2B inválida";
                    reloj.style.color = "#ff7b72";
                    latenciaDiv.innerText = `Latencia: -- ms`;
                    dashboard.innerHTML = ''; 
                    return;
                }

                const json = await response.json();
                
                if (json.detail) {
                    reloj.innerText = "⏳ Motor DaaS calibrando Filtro de Kalman...";
                    reloj.style.color = "#8b949e";
                    latenciaDiv.innerText = `Latencia: -- ms`;
                    dashboard.innerHTML = ''; 
                    return; 
                }
                
                if (!json.data || Object.keys(json.data).length === 0) {
                    return;
                }

                const ahora = new Date();
                reloj.innerText = `🟢 Conectado. Última actualización: ${ahora.toLocaleTimeString()}`;
                reloj.style.color = "#238636";
                
                latenciaDiv.innerText = `Latencia de red: ${latenciaMs} ms`;
                latenciaDiv.style.color = latenciaMs > 300 ? '#d29922' : '#a5d6ff';

                dashboard.innerHTML = ''; 

                for (const [ticker, datos] of Object.entries(json.data)) {
                    const zscore = parseFloat(datos.jerk_zscore).toFixed(2);
                    const regimen = datos.regimen || ""; 
                    
                    let claseAlerta = "";
                    let claseBadge = "";
                    let textoBadge = "✅ NORMAL";
                    let colorZScore = "#58a6ff"; 
                    
                    const esPeligro = regimen.includes("CAÍDA LIBRE") || regimen.includes("SHOCK NEGATIVO") || regimen.includes("COLAPSO") || regimen.includes("FRENADA BRUSCA");
                    const esExito = regimen.includes("IGNICIÓN") || regimen.includes("SHOCK POSITIVO");

                    if (esPeligro) {
                        claseAlerta = "alerta-peligro";
                        claseBadge = "alert-red";
                        textoBadge = "🚨 PELIGRO";
                        colorZScore = "#ff7b72";
                        
                        if (!memoriaAlertas[ticker]) {
                            playPing();
                            memoriaAlertas[ticker] = true; 
                        }
                    } else if (esExito) {
                        claseAlerta = "alerta-exito";
                        claseBadge = "alert-green";
                        textoBadge = "🔥 IGNICIÓN";
                        colorZScore = "#22c55e";
                        
                        memoriaAlertas[ticker] = false; 
                    } else {
                        memoriaAlertas[ticker] = false;
                    }

                    const card = document.createElement('div');
                    card.className = `card ${claseAlerta}`;
                    
                    card.innerHTML = `
                        <div class="ticker-name">
                            ${ticker} 
                            <span class="status-badge ${claseBadge}">
                                ${textoBadge}
                            </span>
                        </div>
                        <div class="metric"><span>Precio:</span> <span>$${parseFloat(datos.precio).toFixed(2)}</span></div>
                        <div class="metric"><span>Velocidad:</span> <span>${parseFloat(datos.velocidad).toFixed(4)} $/s</span></div>
                        <div class="metric"><span>Aceleración:</span> <span>${parseFloat(datos.aceleracion).toFixed(5)} $/s²</span></div>
                        <div class="metric" style="color: ${colorZScore}; font-weight: bold;">
                            <span>Z-Score (Jerk):</span> <span>${zscore} σ</span>
                        </div>
                        <div class="metric" style="font-size: 0.9em; color: #8b949e; margin-top: 15px;">
                            <span>Estado:</span> <span>${regimen}</span>
                        </div>
                    `;
                    dashboard.appendChild(card);
                }
            } catch (error) {
                document.getElementById('reloj').innerText = "❌ Error de conexión o servidor reiniciando...";
                document.getElementById('reloj').style.color = "#ff7b72";
                document.getElementById('latencia').innerText = `Latencia: -- ms`;
            }
        }

        actualizarDatos();
        setInterval(actualizarDatos, 1000);
    </script>
</body>
</html>
